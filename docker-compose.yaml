services:
  ros2_sim:
    image: devxdebanjan/lg_dockerhub:latest
    container_name: ros2_sim
    network_mode: host
    ipc: host
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    devices:
      - /dev/dri:/dev/dri

  flask_server:
    image: devxdebanjan/lg_dockerhub:flask_server_v1
    container_name: flask_server
    network_mode: host
    ipc: host
    depends_on:
      - ros2_sim
