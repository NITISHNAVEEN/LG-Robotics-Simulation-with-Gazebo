services:
  ros2_sim:
    build:
      context: ./robot-pkg       
      dockerfile: Dockerfile
    image: so-arm-interactive
    container_name: ros2_so_arm_interactive
    network_mode: host
    ipc: host
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_DRIVER_CAPABILITIES=all
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    devices:
      - /dev/dri:/dev/dri
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]

  flask_server:
    build:
      context: ./flask-server
      dockerfile: Dockerfile
    container_name: flask_server_robosim
    network_mode: host
    ipc: host
    depends_on:
      - ros2_sim
    runtime: nvidia
    environment:
      - NVIDIA_DRIVER_CAPABILITIES=all
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
